# GOLOW Live Studio (dev). The whole host goes to the dev bot container; the app serves only the studio on it.
# Certificate: certbot --nginx -d live-dev.golow.et
server {
    listen 80;
    server_name live-dev.golow.et;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name live-dev.golow.et;

    ssl_certificate     /etc/letsencrypt/live/live-dev.golow.et/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/live-dev.golow.et/privkey.pem;

    client_max_body_size 64k;

    location / {
        proxy_pass http://127.0.0.1:8100;
        proxy_set_header Host $host;                       # the app decides by Host to serve only the studio
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;   # per-IP sign-in limit
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
