# GOLOW Live Studio (prod). The whole host goes to the prod bot container; the app serves only the studio on it.
#   sudo cp deploy/nginx/live.golow.et.conf /etc/nginx/sites-available/ && sudo ln -s ../sites-available/live.golow.et.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d live.golow.et --redirect     # adds HTTPS (443) and the http → https redirect to this file
server {
    listen 80;
    server_name live.golow.et;

    client_max_body_size 64k;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;                                   # the app serves only the studio on this host
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;   # per-IP sign-in limit
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
